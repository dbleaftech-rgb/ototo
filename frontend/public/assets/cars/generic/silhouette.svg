<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2C30" />
      <stop offset="50%" stop-color="#1A1C20" />
      <stop offset="100%" stop-color="#0E0F11" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3D44" />
      <stop offset="100%" stop-color="#1E2024" />
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7FF3E" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Roof and Greenhouse -->
  <path d="M 180 140 Q 230 110 300 110 Q 370 110 420 140 L 460 220 L 140 220 Z" fill="url(#glassGrad)" />
  
  <!-- Windshield Reflection Highlight -->
  <path d="M 200 145 L 260 215 L 230 215 L 185 150 Z" fill="#FFFFFF" opacity="0.12" />

  <!-- Side Mirrors -->
  <path d="M 115 220 Q 95 210 110 240 Q 130 245 145 235 Z" fill="#1A1C20" />
  <path d="M 485 220 Q 505 210 490 240 Q 470 245 455 235 Z" fill="#1A1C20" />

  <!-- Car Main Body -->
  <path d="M 130 220 Q 300 205 470 220 Q 510 240 520 280 Q 525 330 515 390 Q 500 420 450 425 L 150 425 Q 100 420 85 390 Q 75 330 80 280 Q 90 240 130 220 Z" fill="url(#bodyGrad)" />

  <!-- Hood Line Accent -->
  <path d="M 170 250 Q 300 245 430 250" stroke="#3A3E45" stroke-width="2.5" fill="none" />

  <!-- Modern Sleek Headlights -->
  <!-- Left Headlight -->
  <path d="M 105 285 Q 170 280 210 300 Q 165 315 105 295 Z" fill="#202328" stroke="#3A3E45" stroke-width="1.5" />
  <path d="M 115 288 Q 165 284 195 298" stroke="url(#lightGrad)" stroke-width="3.5" fill="none" opacity="0.9" />
  
  <!-- Right Headlight -->
  <path d="M 495 285 Q 430 280 390 300 Q 435 315 495 295 Z" fill="#202328" stroke="#3A3E45" stroke-width="1.5" />
  <path d="M 485 288 Q 435 284 405 298" stroke="url(#lightGrad)" stroke-width="3.5" fill="none" opacity="0.9" />

  <!-- Center Minimalist Grille -->
  <rect x="230" y="290" width="140" height="32" rx="6" fill="#141518" stroke="#2D3036" stroke-width="1.5" />
  <line x1="245" y1="306" x2="355" y2="306" stroke="#2D3036" stroke-width="2" />

  <!-- Lower Bumper Intake -->
  <rect x="180" y="380" width="240" height="35" rx="5" fill="#121316" />
  
  <!-- Wheels / Tires Silhouette at bottom -->
  <rect x="80" y="375" width="40" height="60" rx="6" fill="#0A0B0C" />
  <rect x="480" y="375" width="40" height="60" rx="6" fill="#0A0B0C" />

  <!-- Plate Mounting Indentation Guide -->
  <rect x="210" y="335" width="180" height="42" rx="4" fill="#0B0C0E" opacity="0.4" />
</svg>
